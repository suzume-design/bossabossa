<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">

  <!-- ① 白地（STYLEタイトルエリア） -->
  <rect width="1200" height="900" fill="white"/>

  <!-- ② 中間エリア（LADIESカードエリア）
       上辺：上の曲線  下辺：下の曲線（逆向きトレース）
       上の曲線: M 0,270 C 200,170 500,350 800,230 C 980,160 1100,210 1200,190
       下の曲線: M 0,520 C 200,380 500,660 800,480 C 980,380 1100,460 1200,420 -->
  <path d="
    M 0,270
    C 200,170 500,350 800,230
    C 980,160 1100,210 1200,190
    L 1200,420
    C 1100,460 980,380 800,480
    C 500,660 200,380 0,520
    Z
  " fill="#EDE8E4"/>

  <!-- ③ グレーエリア（MENSカードエリア） -->
  <path d="
    M 0,520
    C 200,380 500,660 800,480
    C 980,380 1100,460 1200,420
    L 1200,900 L 0,900 Z
  " fill="#B8B4B0"/>

</svg>